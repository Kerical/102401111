<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>校园失物招领小程序 - 原型</title>
<style>
  * { box-sizing: border-box; }
  :root{
    --primary:#4f91e8;
    --primary-soft:#eef7ff;
    --green:#52b997;
    --green-soft:#effbf6;
    --text:#26384a;
    --muted:#718397;
    --line:#e4edf3;
    --bg:#f7fbfd;
    --card:#ffffff;
    --danger:#ef4444;
    --shadow:0 10px 30px rgba(31,41,55,.08);
  }
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#f2f8ff,#fbfdff 46%,#f2fcf8);
    color:var(--text);
  }
  button,input,select,textarea{ font:inherit; }
  button{ cursor:pointer; }
  .shell{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .phone{
    width:393px;
    height:852px;
    background:var(--bg);
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 24px 70px rgba(15,23,42,.18);
    border:8px solid #111827;
    position:relative;
  }
  .statusbar{
    height:26px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    font-size:11px;
    font-weight:600;
  }
  .app{
    height:calc(100% - 26px);
    position:relative;
    overflow:hidden;
  }
  .page{
    display:none;
    height:100%;
    overflow:auto;
    padding-bottom:78px;
    background:var(--bg);
  }
  .page.active{ display:block; }
  .top{
    position:sticky;
    top:0;
    z-index:5;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:14px 16px 12px;
  }
  .top-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .back{
    width:34px;height:34px;border:0;border-radius:11px;
    background:#f3f4f6;color:#374151;font-size:20px;
  }
  .title{
    font-size:18px;
    font-weight:750;
    flex:1;
  }
  .subtitle{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
  }
  .hero{
    background:linear-gradient(135deg,#edf6ff,#ffffff 50%,#eefbf6);
    padding:18px 16px 16px;
    border-bottom:1px solid #e8eef6;
  }
  .hero h1{ margin:0;font-size:22px; }
  .hero p{ margin:5px 0 0;color:var(--muted);font-size:12px; }
  .search-entry{
    margin-top:15px;
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,.94);
    border:1px solid #dbe8f1;
    border-radius:14px;
    padding:11px 13px;
    color:#9ca3af;
    box-shadow:0 3px 14px rgba(15,23,42,.04);
  }
  .quick-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:14px 16px 4px;
  }
  .quick{
    border:1px solid var(--line);
    background:#fff;
    border-radius:18px;
    padding:15px 14px;
    text-align:left;
    box-shadow:0 5px 18px rgba(71,101,130,.055);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .quick:hover{
    transform:translateY(-1px);
    box-shadow:0 8px 22px rgba(71,101,130,.085);
  }
  .quick strong{
    display:block;
    font-size:14px;
    margin-bottom:5px;
    font-weight:750;
    letter-spacing:.1px;
  }
  .quick span{
    color:#75879a;
    font-size:11px;
  }
  .quick.lost{
    border-color:#cfe3f8;
    background:linear-gradient(135deg,#f0f7ff 0%,#fafdff 72%,#ffffff 100%);
  }
  .quick.lost strong{ color:#356fa7; }
  .quick.found{
    border-color:#cdebdc;
    background:linear-gradient(135deg,#effaf5 0%,#f9fefb 72%,#ffffff 100%);
  }
  .quick.found strong{ color:#347a64; }

  .section{
    padding:14px 16px;
  }
  .section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
  }
  .section-head h2{ margin:0;font-size:16px; }
  .tabs{
    display:flex;
    gap:4px;
    background:#e9eef5;
    border-radius:12px;
    padding:3px;
  }
  .tab{
    border:0;background:transparent;color:var(--muted);
    border-radius:9px;padding:6px 10px;font-size:11px;
  }
  .tab.active{ background:#fff;color:var(--primary);font-weight:700;box-shadow:0 1px 5px rgba(15,23,42,.08); }
  .list{ display:flex;flex-direction:column;gap:10px; }
  .card{
    background:#fff;border:1px solid #e8eff4;border-radius:17px;
    padding:12px;box-shadow:0 5px 18px rgba(15,23,42,.045);
  }
  .card.clickable:hover{ border-color:#bfdbfe; }
  .card-row{ display:flex;gap:12px; }
  .thumb{
    width:82px;height:82px;border-radius:14px;flex:0 0 82px;
    display:flex;align-items:center;justify-content:center;
    font-size:32px;background:linear-gradient(135deg,#e0f2fe,#ecfdf5);
    border:1px solid #e6eef6;
  }
  .card-main{ min-width:0;flex:1; }
  .card-title-row{ display:flex;align-items:flex-start;gap:8px; }
  .card-title{ font-size:14px;font-weight:750;flex:1;line-height:1.35; }
  .badge{
    display:inline-flex;align-items:center;
    border-radius:999px;padding:3px 7px;font-size:10px;font-weight:700;
    white-space:nowrap;
  }
  .badge.found{ color:#047857;background:#d1fae5; }
  .badge.lost{ color:#1d4ed8;background:#dbeafe; }
  .badge.done{ color:#6b7280;background:#f3f4f6; }
  .desc{
    font-size:11px;line-height:1.55;color:#4b5563;margin-top:6px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .meta{
    margin-top:8px;color:#9ca3af;font-size:10px;
    display:flex;gap:10px;flex-wrap:wrap;
  }

  .bottom-nav{
    position:absolute;left:0;right:0;bottom:0;height:68px;
    background:#fff;border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(4,1fr);z-index:20;
  }
  .nav-btn{
    border:0;background:#fff;color:#9ca3af;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;font-size:10px;
  }
  .nav-btn b{ font-size:19px;line-height:1; }
  .nav-btn.active{ color:var(--primary);font-weight:700; }

  .form{
    padding:14px 16px 20px;
    display:flex;flex-direction:column;gap:13px;
  }
  .segmented{
    display:grid;grid-template-columns:1fr 1fr;
    background:#e9eef5;border-radius:14px;padding:4px;
  }
  .seg-btn{
    border:0;border-radius:11px;padding:10px;background:transparent;color:var(--muted);
  }
  .seg-btn.active.lost{ background:#fff;color:#2563eb;font-weight:700;box-shadow:0 2px 8px rgba(15,23,42,.07); }
  .seg-btn.active.found{ background:#fff;color:#059669;font-weight:700;box-shadow:0 2px 8px rgba(15,23,42,.07); }
  .field label{
    display:block;font-size:12px;font-weight:700;margin-bottom:6px;
  }
  .req{ color:var(--danger); }
  .control{
    width:100%;border:1px solid #dce3eb;border-radius:12px;
    background:#fff;padding:11px 12px;color:var(--text);outline:none;
  }
  .control:focus{ border-color:#93c5fd;box-shadow:0 0 0 3px #dbeafe; }
  textarea.control{ resize:none;min-height:94px;line-height:1.5; }
  .hint{ color:#9ca3af;font-size:10px;margin-top:5px;line-height:1.45; }
  .upload{
    border:1px dashed #b9c4d2;border-radius:13px;background:#fff;
    padding:16px;text-align:center;color:#64748b;font-size:12px;
  }
  .primary-btn{
    width:100%;border:0;border-radius:14px;
    background:linear-gradient(90deg,#3b82f6,#22c55e);
    color:white;font-weight:750;padding:13px 14px;
    box-shadow:0 8px 18px rgba(59,130,246,.18);
  }
  .secondary-btn{
    width:100%;border:1px solid #dbe3ed;border-radius:14px;
    background:#fff;color:#475569;font-weight:700;padding:12px 14px;
  }
  .danger-btn{
    width:100%;border:1px solid #fecaca;border-radius:14px;
    background:#fff1f2;color:#be123c;font-weight:700;padding:12px 14px;
  }

  .search-box{
    margin-top:10px;display:flex;gap:8px;
  }
  .search-box input{ flex:1; }
  .search-go{
    border:0;border-radius:12px;background:var(--primary);color:white;padding:0 16px;font-weight:700;
  }
  .chips{ display:flex;flex-wrap:wrap;gap:8px;margin-top:12px; }
  .chip{
    border:1px solid #dbe3ed;background:#fff;border-radius:999px;
    padding:6px 10px;font-size:11px;color:#475569;
  }
  .result-note{ color:var(--muted);font-size:11px;margin-bottom:10px; }

  .detail-cover{
    margin:14px 16px 0;height:180px;border-radius:20px;
    background:linear-gradient(135deg,#dbeafe,#ffffff,#d1fae5);
    display:flex;align-items:center;justify-content:center;font-size:68px;
    border:1px solid #e2e8f0;
  }
  .detail-card{
    margin:12px 16px;background:#fff;border:1px solid #edf0f4;
    border-radius:18px;padding:16px;box-shadow:0 5px 16px rgba(15,23,42,.04);
  }
  .detail-title{ font-size:20px;font-weight:800;margin:8px 0 4px; }
  .detail-grid{
    display:grid;grid-template-columns:72px 1fr;gap:11px 10px;
    margin-top:15px;font-size:12px;
  }
  .detail-grid .k{ color:#94a3b8; }
  .detail-grid .v{ color:#334155;font-weight:600; }
  .detail-text{ color:#475569;font-size:12px;line-height:1.75; }
  .contact-box{
    background:#ecfdf5;border:1px solid #d1fae5;border-radius:14px;
    padding:12px;font-size:12px;color:#047857;margin-top:10px;
  }
  .notice{
    background:#eff6ff;border:1px solid #dbeafe;border-radius:14px;
    color:#1e40af;padding:11px 12px;font-size:11px;line-height:1.55;
  }

  .my-actions{ display:flex;gap:8px;margin-top:10px; }
  .small-btn{
    flex:1;border:1px solid #dbe3ed;background:#fff;border-radius:10px;
    padding:8px;font-size:11px;color:#475569;font-weight:650;
  }
  .small-btn.primary{ color:#2563eb;background:#eff6ff;border-color:#dbeafe; }

  .status-options{ display:flex;flex-direction:column;gap:9px; }
  .status-option{
    border:1px solid #dbe3ed;background:#fff;border-radius:14px;
    padding:12px;display:flex;gap:10px;align-items:flex-start;
  }
  .status-option input{ margin-top:3px; }
  .status-option strong{ font-size:13px;display:block; }
  .status-option span{ display:block;color:var(--muted);font-size:10px;margin-top:3px;line-height:1.45; }

  .success{
    min-height:100%;
    padding:42px 22px 90px;
    display:flex;flex-direction:column;align-items:center;text-align:center;
  }
  .success-icon{
    width:86px;height:86px;border-radius:50%;
    display:grid;place-items:center;font-size:42px;
    background:#d1fae5;color:#059669;margin-top:30px;
  }
  .success h2{ font-size:22px;margin:18px 0 8px; }
  .success p{ color:var(--muted);font-size:12px;line-height:1.65;margin:0 0 20px; }
  .success-summary{
    width:100%;background:#fff;border:1px solid var(--line);border-radius:17px;
    text-align:left;padding:14px;margin-bottom:16px;
  }
  .success-summary strong{ display:block;margin-bottom:8px; }
  .success-actions{ width:100%;display:flex;flex-direction:column;gap:9px; }

  .empty{
    padding:42px 18px;text-align:center;color:#9ca3af;font-size:12px;
  }
  .toast{
    position:absolute;left:50%;bottom:88px;transform:translateX(-50%) translateY(16px);
    background:rgba(17,24,39,.92);color:#fff;border-radius:999px;
    padding:9px 14px;font-size:11px;opacity:0;pointer-events:none;
    transition:.2s;z-index:40;white-space:nowrap;
  }
  .toast.show{ opacity:1;transform:translateX(-50%) translateY(0); }

  @media (max-width:460px){
    .shell{ padding:0;display:block;background:var(--bg); }
    .phone{ width:100vw;height:100vh;border:0;border-radius:0;box-shadow:none; }
  }

  /* ===== 我的发布新版 ===== */
  .my-page{ background:#f7fbfd; }
  .my-header{
    background:linear-gradient(180deg,#ffffff 0%,#f7fbfd 100%);
    padding:14px 16px 16px;
    border-bottom:1px solid #edf2f6;
  }
  .my-title-row{
    display:flex;align-items:center;justify-content:center;
    position:relative;margin-bottom:14px;
  }
  .my-title-row .title{ text-align:center;font-size:18px;font-weight:800; }
  .settings-btn{
    position:absolute;right:0;top:-2px;width:36px;height:36px;border:0;
    border-radius:50%;background:#f1f5f9;color:#64748b;font-size:17px;
  }
  .profile-card{
    background:linear-gradient(135deg,#edf4ff 0%,#f4f7ff 58%,#f0fbf7 100%);
    border:1px solid #dfe9f6;border-radius:20px;padding:16px;
    box-shadow:0 6px 20px rgba(75,105,140,.05);
  }
  .profile-main{ display:flex;align-items:center;gap:12px; }
  .avatar{
    width:52px;height:52px;flex:0 0 52px;border-radius:50%;
    display:grid;place-items:center;
    background:linear-gradient(135deg,#4f91e8,#6f82f3);
    color:#fff;font-weight:800;font-size:22px;
  }
  .profile-info{ flex:1;min-width:0; }
  .profile-name{ font-size:16px;font-weight:800;color:#24364a; }
  .profile-class{ margin-top:4px;color:#718397;font-size:11px; }
  .credit-badge{
    flex:none;padding:6px 10px;border-radius:999px;
    background:rgba(255,255,255,.9);border:1px solid #dfe9f6;
    color:#4f7fd8;font-size:10px;font-weight:700;
  }
  .profile-stats{
    display:grid;grid-template-columns:repeat(3,1fr);
    margin-top:14px;padding-top:13px;border-top:1px solid rgba(148,163,184,.18);
  }
  .profile-stat{ text-align:center;position:relative; }
  .profile-stat + .profile-stat::before{
    content:"";position:absolute;left:0;top:3px;width:1px;height:38px;background:#dfe7f1;
  }
  .profile-stat strong{ display:block;font-size:19px;line-height:1.1;margin-bottom:4px; }
  .profile-stat span{ color:#718397;font-size:10px; }
  .profile-stat.ongoing strong{ color:#4f7ff2; }
  .profile-stat.finished strong{ color:#45a984; }

  .my-toolbar{
    display:flex;align-items:center;gap:8px;padding:13px 16px 10px;
    background:#fff;border-bottom:1px solid #edf2f6;
  }
  .my-filter{
    border:0;border-radius:999px;padding:8px 14px;
    background:#f1f5f9;color:#64748b;font-size:11px;font-weight:650;
  }
  .my-filter.active{
    background:#4f91e8;color:#fff;
    box-shadow:0 5px 12px rgba(79,145,232,.18);
  }
  .new-post-btn{
    margin-left:auto;border:0;background:transparent;color:#4f7ff2;
    font-size:11px;font-weight:750;padding:7px 0;
  }
  .my-list-wrap{ padding:12px 16px 18px; }
  .my-post-card{
    background:#fff;border:1px solid #e8eff4;border-radius:18px;padding:13px;
    box-shadow:0 5px 18px rgba(15,23,42,.045);
  }
  .my-post-card + .my-post-card{ margin-top:10px; }
  .my-post-main{ display:flex;gap:12px; }
  .my-post-icon{
    width:56px;height:56px;flex:0 0 56px;border-radius:14px;
    display:grid;place-items:center;
    background:linear-gradient(135deg,#edf4ff,#eefbf6);
    font-size:25px;border:1px solid #e5edf5;
  }
  .my-post-content{ flex:1;min-width:0; }
  .my-post-title-row{ display:flex;align-items:flex-start;gap:8px; }
  .my-post-title{ flex:1;font-size:14px;font-weight:800;line-height:1.35; }
  .status-pill{
    flex:none;border-radius:999px;padding:3px 8px;font-size:9px;font-weight:700;
  }
  .status-pill.ongoing{ color:#c97816;background:#fff4df; }
  .status-pill.finished{ color:#568274;background:#eef7f3; }
  .my-tags{ display:flex;align-items:center;gap:7px;margin-top:6px; }
  .type-tag{ border-radius:999px;padding:3px 8px;font-size:9px;font-weight:700; }
  .type-tag.lost{ color:#356fa7;background:#edf5ff; }
  .type-tag.found{ color:#347a64;background:#edf9f4; }
  .category-divider{ width:1px;height:11px;background:#dbe3eb; }
  .category-text{ color:#94a3b8;font-size:9px; }
  .my-post-meta{
    margin-top:8px;color:#8292a3;font-size:10px;
    display:flex;flex-direction:column;gap:5px;
  }
  .meta-line{ display:flex;align-items:center;justify-content:space-between;gap:8px; }
  .view-count{ white-space:nowrap;color:#8a99a8; }
  .my-card-actions{
    display:grid;grid-template-columns:1fr 1fr;gap:9px;
    padding-top:11px;margin-top:11px;border-top:1px solid #edf1f5;
  }
  .manage-btn{
    border:0;border-radius:12px;padding:9px 8px;font-size:11px;font-weight:700;
  }
  .manage-btn.finish{ background:#edf4ff;color:#4b78e6; }
  .manage-btn.finish:disabled{ color:#8292a3;background:#f1f5f9;cursor:default; }
  .manage-btn.delete{ background:#fff0f3;color:#e65c78; }

</style>
</head>
<body>
<div class="shell">
  <div class="phone">
    <div class="statusbar"><span>9:41</span><span>● ● ●</span></div>
    <div class="app">

      <!-- 首页 -->
      <section class="page active" id="page-home">
        <div class="hero">
          <h1>校园失物招领</h1>
          <p>集中发布、快速查找，让物品更容易回到主人手里</p>
          <div class="search-entry" onclick="openPage('search')">🔍 搜索校园卡、钥匙、耳机等</div>
        </div>

        <div class="quick-actions">
          <button class="quick lost" onclick="openPublish('lost')">
            <strong>🔎 我丢了东西</strong><span>发布寻物信息</span>
          </button>
          <button class="quick found" onclick="openPublish('found')">
            <strong>📦 我捡到东西</strong><span>发布招领信息</span>
          </button>
        </div>

        <div class="section">
          <div class="section-head">
            <h2>最新信息</h2>
            <div class="tabs" id="homeTabs">
              <button class="tab active" data-filter="all">全部</button>
              <button class="tab" data-filter="lost">寻物</button>
              <button class="tab" data-filter="found">招领</button>
            </div>
          </div>
          <div class="list" id="homeList"></div>
        </div>
      </section>

      <!-- 搜索 -->
      <section class="page" id="page-search">
        <div class="top">
          <div class="title">搜索物品</div>
          <div class="subtitle">按物品名称或关键词查找相关信息</div>
          <div class="search-box">
            <input id="searchInput" class="control" placeholder="如：校园卡、雨伞、耳机" />
            <button class="search-go" onclick="runSearch()">搜索</button>
          </div>
          <div class="chips">
            <button class="chip" onclick="quickSearch('校园卡')">校园卡</button>
            <button class="chip" onclick="quickSearch('钥匙')">钥匙</button>
            <button class="chip" onclick="quickSearch('雨伞')">雨伞</button>
            <button class="chip" onclick="quickSearch('耳机')">耳机</button>
          </div>
        </div>
        <div class="section">
          <div class="result-note" id="searchNote">输入关键词开始搜索，也可以直接浏览全部信息。</div>
          <div class="list" id="searchList"></div>
        </div>
      </section>

      <!-- 发布 -->
      <section class="page" id="page-publish">
        <div class="top">
          <div class="title">发布信息</div>
          <div class="subtitle">请尽量准确填写，方便其他同学识别物品</div>
        </div>
        <form class="form" id="publishForm" onsubmit="submitPost(event)">
          <div class="segmented">
            <button type="button" id="segLost" class="seg-btn active lost" onclick="setPublishType('lost')">发布寻物</button>
            <button type="button" id="segFound" class="seg-btn found" onclick="setPublishType('found')">发布招领</button>
          </div>

          <div class="field">
            <label>物品名称 <span class="req">*</span></label>
            <input class="control" id="pubName" required placeholder="例如：黑色长柄雨伞" />
          </div>
          <div class="field">
            <label>物品类别 <span class="req">*</span></label>
            <select class="control" id="pubCategory" required>
              <option value="">请选择类别</option>
              <option>校园卡/证件</option><option>钥匙</option><option>电子产品</option>
              <option>雨伞</option><option>书籍文具</option><option>水杯</option><option>其他</option>
            </select>
          </div>
          <div class="field">
            <label id="timeLabel">丢失时间 <span class="req">*</span></label>
            <input class="control" id="pubTime" type="datetime-local" required />
          </div>
          <div class="field">
            <label id="placeLabel">丢失地点 <span class="req">*</span></label>
            <input class="control" id="pubPlace" required placeholder="例如：图书馆一楼大厅" />
          </div>
          <div class="field">
            <label>物品图片</label>
            <div class="upload">＋ 添加图片<br><span class="hint">原型中仅展示上传入口，不处理真实文件</span></div>
          </div>
          <div class="field">
            <label>物品描述 <span class="req">*</span></label>
            <textarea class="control" id="pubDesc" required placeholder="描述颜色、外观、明显特征等"></textarea>
          </div>
          <div class="field">
            <label>联系方式 <span class="req">*</span></label>
            <input class="control" id="pubContact" required placeholder="QQ / 微信 / 手机号" />
            <div class="hint">仅用于失主和拾物者取得联系。</div>
          </div>
          <button class="primary-btn" type="submit">发布信息</button>
        </form>
      </section>

      <!-- 详情 -->
      <section class="page" id="page-detail">
        <div class="top">
          <div class="top-row">
            <button class="back" onclick="goBack()">‹</button>
            <div class="title">信息详情</div>
          </div>
        </div>
        <div id="detailContent"></div>
      </section>

      <!-- 我的发布 -->
      <section class="page my-page" id="page-my">
        <div class="my-header">
          <div class="my-title-row">
            <div class="title">我的发布</div>
            <button class="settings-btn" type="button" aria-label="设置">⚙</button>
          </div>

          <div class="profile-card">
            <div class="profile-main">
              <div class="avatar">林</div>
              <div class="profile-info">
                <div class="profile-name">林同学</div>
                <div class="profile-class">计算机学院 · 2023级软件工程2班</div>
              </div>
              <div class="credit-badge">信用分 96</div>
            </div>

            <div class="profile-stats">
              <div class="profile-stat">
                <strong id="myTotalCount">0</strong>
                <span>我发布的</span>
              </div>
              <div class="profile-stat ongoing">
                <strong id="myOngoingCount">0</strong>
                <span>进行中</span>
              </div>
              <div class="profile-stat finished">
                <strong id="myFinishedCount">0</strong>
                <span>已结束</span>
              </div>
            </div>
          </div>
        </div>

        <div class="my-toolbar" id="myTabs">
          <button class="my-filter active" data-filter="all">全部</button>
          <button class="my-filter" data-filter="ongoing">进行中</button>
          <button class="my-filter" data-filter="finished">已结束</button>
          <button class="new-post-btn" onclick="openPage('publish')">⊕ 新建发布</button>
        </div>

        <div class="my-list-wrap">
          <div id="myList"></div>
        </div>
      </section>

      <!-- 状态更新 -->
      <section class="page" id="page-status">
        <div class="top">
          <div class="top-row">
            <button class="back" onclick="openPage('my')">‹</button>
            <div class="title">更新物品状态</div>
          </div>
        </div>
        <div class="form">
          <div class="card" id="statusPostInfo"></div>
          <div class="field">
            <label>选择新的状态</label>
            <div class="status-options" id="statusOptions"></div>
          </div>
          <button class="primary-btn" onclick="confirmStatus()">确认修改</button>
        </div>
      </section>

      <!-- 发布成功 -->
      <section class="page" id="page-success">
        <div class="success">
          <div class="success-icon">✓</div>
          <h2>发布成功</h2>
          <p>信息已经发布。其他同学可以在首页和搜索结果中看到它。</p>
          <div class="success-summary" id="successSummary"></div>
          <div class="success-actions">
            <button class="primary-btn" onclick="openPage('home')">返回首页</button>
            <button class="secondary-btn" onclick="openPage('my')">查看我的发布</button>
          </div>
        </div>
      </section>

      <!-- 底部导航 -->
      <nav class="bottom-nav" id="bottomNav">
        <button class="nav-btn active" data-page="home" onclick="openPage('home')"><b>⌂</b><span>首页</span></button>
        <button class="nav-btn" data-page="search" onclick="openPage('search')"><b>⌕</b><span>搜索</span></button>
        <button class="nav-btn" data-page="publish" onclick="openPage('publish')"><b>＋</b><span>发布</span></button>
        <button class="nav-btn" data-page="my" onclick="openPage('my')"><b>◎</b><span>我的</span></button>
      </nav>

      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>

<script>
const posts = [
  {
    id:1,type:'found',mine:true,name:'校园卡（一卡通）',category:'校园卡/证件',
    place:'三食堂二楼',time:'2026-09-27 12:30',status:'招领中',
    desc:'在三食堂二楼靠窗位置捡到一张校园卡，卡面完好，已暂时保管。',
    contact:'QQ：123456789',icon:'🪪',views:128
  },
  {
    id:2,type:'lost',mine:true,name:'黑色长柄雨伞',category:'雨伞',
    place:'图书馆一楼大厅',time:'2026-09-27 08:10',status:'寻找中',
    desc:'黑色长柄雨伞，伞柄有银色金属环，可能遗落在图书馆门口伞架。',
    contact:'微信：lost-umbrella',icon:'☂️',views:86
  },
  {
    id:3,type:'found',mine:false,name:'AirPods Pro 充电盒',category:'电子产品',
    place:'东区体育馆',time:'2026-09-26 19:20',status:'招领中',
    desc:'白色充电盒，盒身有一道浅划痕，可通过外观细节确认。',
    contact:'QQ：987654321',icon:'🎧',views:64
  },
  {
    id:4,type:'lost',mine:false,name:'钥匙串',category:'钥匙',
    place:'1号教学楼 305',time:'2026-09-26 16:40',status:'寻找中',
    desc:'三把钥匙，带黄色小熊挂件，其中包含宿舍钥匙。',
    contact:'手机：138****5678',icon:'🔑',views:42
  },
  {
    id:5,type:'found',mine:false,name:'蓝色保温杯',category:'水杯',
    place:'北苑宿舍楼下',time:'2026-09-25 09:15',status:'已归还',
    desc:'杯身有贴纸，已经归还失主，本信息保留用于展示状态。',
    contact:'已解决',icon:'🥤',views:73
  },
  {
    id:6,type:'found',mine:true,name:'灰色针织帽',category:'衣物配饰',
    place:'东区操场看台',time:'2026-09-24 18:20',status:'已归还',
    desc:'灰色针织帽，帽沿内侧有小标签，已经归还失主。',
    contact:'已解决',icon:'🧢',views:51
  }
];

let currentPage = 'home';
let previousPage = 'home';
let publishType = 'lost';
let currentDetailId = 1;
let currentStatusId = 1;

function badgeClass(post){
  if(post.status === '已归还' || post.status === '已找到' || post.status === '已解决') return 'done';
  return post.type;
}

function typeText(type){ return type === 'lost' ? '寻物' : '招领'; }

function cardHTML(post, my=false){
  return `
    <div class="card clickable" ${my ? '' : `onclick="openDetail(${post.id})"`}>
      <div class="card-row">
        <div class="thumb">${post.icon}</div>
        <div class="card-main">
          <div class="card-title-row">
            <div class="card-title">${post.name}</div>
            <span class="badge ${badgeClass(post)}">${post.status}</span>
          </div>
          <div class="desc">${post.desc}</div>
          <div class="meta">
            <span>📍 ${post.place}</span>
            <span>🕒 ${post.time}</span>
            <span>${typeText(post.type)}</span>
          </div>
          ${my ? `
            <div class="my-actions">
              <button class="small-btn" onclick="event.stopPropagation();openDetail(${post.id})">查看详情</button>
              ${post.status === '寻找中' || post.status === '招领中'
                ? `<button class="small-btn primary" onclick="event.stopPropagation();openStatus(${post.id})">更新状态</button>`
                : `<button class="small-btn" disabled>已解决</button>`}
            </div>` : ''}
        </div>
      </div>
    </div>`;
}

function renderHome(filter='all'){
  const data = posts.filter(p => filter==='all' ? true : p.type===filter)
                    .filter(p => !['已归还','已找到','已解决'].includes(p.status));
  document.getElementById('homeList').innerHTML = data.map(p=>cardHTML(p)).join('') || '<div class="empty">暂无相关信息</div>';
}

function renderSearch(data=posts){
  document.getElementById('searchList').innerHTML = data.map(p=>cardHTML(p)).join('') || '<div class="empty">没有找到相关物品，可以尝试更换关键词或发布寻物信息。</div>';
}

function isFinished(post){
  return ['已归还','已找到','已解决'].includes(post.status);
}

function myPostHTML(post){
  const finished = isFinished(post);
  const viewCount = post.views ?? 0;
  return `
    <div class="my-post-card">
      <div class="my-post-main">
        <div class="my-post-icon">${post.icon}</div>
        <div class="my-post-content">
          <div class="my-post-title-row">
            <div class="my-post-title">${post.name}</div>
            <span class="status-pill ${finished ? 'finished' : 'ongoing'}">${finished ? '已结束' : '进行中'}</span>
          </div>
          <div class="my-tags">
            <span class="type-tag ${post.type}">${typeText(post.type)}</span>
            <span class="category-divider"></span>
            <span class="category-text">${post.category}</span>
          </div>
          <div class="my-post-meta">
            <div>⌖ ${post.place}</div>
            <div class="meta-line">
              <span>◷ ${post.time}</span>
              <span class="view-count">◉ ${viewCount} 次浏览</span>
            </div>
          </div>
        </div>
      </div>
      <div class="my-card-actions">
        <button class="manage-btn finish"
          ${finished ? 'disabled' : `onclick="openStatus(${post.id})"`}>
          ${finished ? '✓ 已结束' : '✓ 更新状态'}
        </button>
        <button class="manage-btn delete" onclick="deleteMyPost(${post.id})">⌫ 删除</button>
      </div>
    </div>`;
}

function renderMy(filter='all'){
  const minePosts = posts.filter(p => p.mine);
  const ongoingCount = minePosts.filter(p => !isFinished(p)).length;
  const finishedCount = minePosts.filter(p => isFinished(p)).length;

  const totalEl = document.getElementById('myTotalCount');
  const ongoingEl = document.getElementById('myOngoingCount');
  const finishedEl = document.getElementById('myFinishedCount');
  if(totalEl) totalEl.textContent = minePosts.length;
  if(ongoingEl) ongoingEl.textContent = ongoingCount;
  if(finishedEl) finishedEl.textContent = finishedCount;

  const data = minePosts.filter(p => {
    if(filter === 'all') return true;
    if(filter === 'ongoing') return !isFinished(p);
    if(filter === 'finished') return isFinished(p);
    return true;
  });

  document.getElementById('myList').innerHTML =
    data.map(myPostHTML).join('') || '<div class="empty">暂无相关发布</div>';
}

function openPage(name){
  previousPage = currentPage;
  currentPage = name;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');

  const hideNav = ['detail','status','success'].includes(name);
  document.getElementById('bottomNav').style.display = hideNav ? 'none' : 'grid';

  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.page===name);
  });

  if(name==='home') renderHome(getActiveFilter('homeTabs'));
  if(name==='search') renderSearch(posts);
  if(name==='my') renderMy(getActiveFilter('myTabs'));
}

function goBack(){
  openPage(previousPage === 'detail' ? 'home' : previousPage);
}

function openDetail(id){
  currentDetailId = id;
  const p = posts.find(x=>x.id===id);
  const mineAction = p.mine && (p.status==='寻找中' || p.status==='招领中')
    ? `<button class="secondary-btn" onclick="openStatus(${p.id})">更新物品状态</button>` : '';
  document.getElementById('detailContent').innerHTML = `
    <div class="detail-cover">${p.icon}</div>
    <div class="detail-card">
      <span class="badge ${p.type}">${typeText(p.type)}信息</span>
      <div class="detail-title">${p.name}</div>
      <span class="badge ${badgeClass(p)}">${p.status}</span>
      <div class="detail-grid">
        <div class="k">${p.type==='lost'?'丢失时间':'拾取时间'}</div><div class="v">${p.time}</div>
        <div class="k">${p.type==='lost'?'丢失地点':'拾取地点'}</div><div class="v">${p.place}</div>
        <div class="k">物品类别</div><div class="v">${p.category}</div>
      </div>
    </div>
    <div class="detail-card">
      <strong>物品描述</strong>
      <p class="detail-text">${p.desc}</p>
    </div>
    <div class="detail-card">
      <strong>联系方式</strong>
      <div id="contactArea" class="hint" style="margin:8px 0 10px">点击按钮后查看发布者留下的联系方式。</div>
      <button class="primary-btn" onclick="showContact(${p.id})">查看联系方式</button>
    </div>
    <div class="section" style="padding-top:0">
      ${mineAction}
    </div>`;
  openPage('detail');
}

function showContact(id){
  const p=posts.find(x=>x.id===id);
  document.getElementById('contactArea').innerHTML = `<div class="contact-box">${p.contact}</div>`;
}

function openPublish(type){
  setPublishType(type);
  openPage('publish');
}

function setPublishType(type){
  publishType=type;
  const lost=document.getElementById('segLost');
  const found=document.getElementById('segFound');
  lost.classList.toggle('active',type==='lost');
  found.classList.toggle('active',type==='found');
  document.getElementById('timeLabel').innerHTML=(type==='lost'?'丢失时间':'拾取时间')+' <span class="req">*</span>';
  document.getElementById('placeLabel').innerHTML=(type==='lost'?'丢失地点':'拾取地点')+' <span class="req">*</span>';
}

function submitPost(e){
  e.preventDefault();
  const name=document.getElementById('pubName').value.trim();
  const category=document.getElementById('pubCategory').value;
  const rawTime=document.getElementById('pubTime').value;
  const place=document.getElementById('pubPlace').value.trim();
  const desc=document.getElementById('pubDesc').value.trim();
  const contact=document.getElementById('pubContact').value.trim();

  if(!name || !category || !rawTime || !place || !desc || !contact){
    toast('请先填写完整的必填信息');
    return;
  }

  const newPost={
    id:Date.now(),
    type:publishType,
    mine:true,
    name,category,place,
    time:rawTime.replace('T',' '),
    status:publishType==='lost'?'寻找中':'招领中',
    desc,contact,
    icon:publishType==='lost'?'🔎':'📦',
    views:0
  };
  posts.unshift(newPost);
  document.getElementById('successSummary').innerHTML=
    `<strong>${newPost.name}</strong>
     <div class="meta"><span>${typeText(newPost.type)}信息</span><span>📍 ${newPost.place}</span></div>`;
  e.target.reset();
  setPublishType('lost');
  renderHome('all'); renderMy('all'); renderSearch(posts);
  openPage('success');
}

function runSearch(){
  const kw=document.getElementById('searchInput').value.trim().toLowerCase();
  const data=kw ? posts.filter(p=>
    [p.name,p.category,p.place,p.desc].join(' ').toLowerCase().includes(kw)
  ) : posts;
  document.getElementById('searchNote').textContent = kw ? `找到 ${data.length} 条与“${kw}”相关的信息` : `共 ${data.length} 条信息`;
  renderSearch(data);
}

function quickSearch(kw){
  document.getElementById('searchInput').value=kw;
  runSearch();
}

function openStatus(id){
  currentStatusId=id;
  const p=posts.find(x=>x.id===id);
  document.getElementById('statusPostInfo').innerHTML=
    `<strong>${p.name}</strong>
     <div class="meta"><span>当前状态：${p.status}</span><span>📍 ${p.place}</span></div>`;
  const resolved = p.type==='lost' ? '已找到' : '已归还';
  const keep = p.type==='lost' ? '寻找中' : '招领中';
  document.getElementById('statusOptions').innerHTML=`
    <label class="status-option">
      <input type="radio" name="newStatus" value="${resolved}" checked />
      <div><strong>${resolved}</strong><span>物品已经${p.type==='lost'?'找回':'归还'}，信息不再显示在首页。</span></div>
    </label>
    <label class="status-option">
      <input type="radio" name="newStatus" value="${keep}" />
      <div><strong>继续保持“${keep}”</strong><span>暂时还没有解决，继续展示该信息。</span></div>
    </label>`;
  openPage('status');
}


function deleteMyPost(id){
  const p = posts.find(x=>x.id===id);
  if(!p) return;

  const ok = confirm(`确定删除“${p.name}”这条发布吗？`);
  if(!ok) return;

  const index = posts.findIndex(x=>x.id===id);
  if(index !== -1) posts.splice(index,1);

  renderHome('all');
  renderSearch(posts);
  renderMy(getActiveFilter('myTabs'));
  toast('发布已删除');
}

function confirmStatus(){
  const selected=document.querySelector('input[name="newStatus"]:checked');
  if(!selected){ toast('请选择新的状态'); return; }
  const p=posts.find(x=>x.id===currentStatusId);
  p.status=selected.value;
  renderHome('all'); renderMy('all'); renderSearch(posts);
  toast('状态更新成功');
  setTimeout(()=>openPage('my'),500);
}

function getActiveFilter(id){
  const el=document.querySelector('#'+id+' .tab.active, #'+id+' .my-filter.active');
  return el ? el.dataset.filter : 'all';
}

document.querySelectorAll('#homeTabs .tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('#homeTabs .tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderHome(btn.dataset.filter);
  });
});
document.querySelectorAll('#myTabs .my-filter').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('#myTabs .my-filter').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderMy(btn.dataset.filter);
  });
});

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1400);
}

renderHome();
renderSearch();
renderMy();
</script>
</body>
</html>
