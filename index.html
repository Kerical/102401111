<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园失物招领</title>
  <link rel="stylesheet" href="css/app.css">
  <script defer src="js/posts.js"></script>
  <script defer src="js/home.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="#home"><span aria-hidden="true">⌂</span> 校园失物招领</a>
      <span class="header-note">让物品回到主人手里</span>
    </header>
    <main id="main-content">
      <p id="source-note" class="source-note" role="status"></p>
      <section id="page-home" class="page" aria-labelledby="home-heading">
        <div class="hero">
          <h1 id="home-heading">校园里的失物，在这里找</h1>
          <p>集中浏览寻物与招领信息，找到线索后联系发布者。</p>
          <button class="search-entry" type="button" disabled><span aria-hidden="true">⌕</span> 关键词搜索即将开放</button>
        </div>
        <div class="quick-actions">
          <button class="quick lost" type="button" data-publish-type="lost" disabled>
            <strong>🔎 我丢了东西</strong><span>发布寻物 · 暂未开放</span>
          </button>
          <button class="quick found" type="button" data-publish-type="found" disabled>
            <strong>📦 我捡到东西</strong><span>发布招领 · 暂未开放</span>
          </button>
        </div>
        <div class="section">
          <div class="section-head">
            <h2>最新信息</h2>
            <div class="tabs" id="home-tabs" role="group" aria-label="信息类型">
              <button class="tab active" type="button" data-type="all" aria-pressed="true">全部</button>
              <button class="tab" type="button" data-type="lost" aria-pressed="false">寻物</button>
              <button class="tab" type="button" data-type="found" aria-pressed="false">招领</button>
            </div>
          </div>
          <form class="filter-form" id="home-filter-form">
            <label>物品类别<select id="home-category"><option value="">全部类别</option></select></label>
            <label>丢失 / 拾取地点<input id="home-place" type="search" maxlength="100" placeholder="例如：图书馆"></label>
            <button class="filter-button" type="submit">筛选</button>
            <button class="text-button" type="button" id="home-reset">重置</button>
          </form>
          <p class="result-note" id="home-count" aria-live="polite"></p>
          <div class="list" id="home-list"></div>
        </div>
      </section>
      <section id="page-search" class="page" hidden>
        <div class="empty"><h1>关键词搜索即将开放</h1><a href="#home">返回首页</a></div>
      </section>
      <section id="page-detail" class="page" hidden>
        <div class="empty"><h1>详情模块即将开放</h1><a href="#home">返回首页</a></div>
      </section>
    </main>
    <nav class="bottom-nav" aria-label="主要导航">
      <a class="nav-link active" href="#home" data-page="home" aria-current="page"><b aria-hidden="true">⌂</b>首页</a>
      <button class="nav-link" type="button" disabled><b aria-hidden="true">⌕</b>搜索 · 待开放</button>
      <button class="nav-link" type="button" data-page="publish" disabled><b aria-hidden="true">＋</b>发布 · 待开放</button>
      <button class="nav-link" type="button" data-page="my" disabled><b aria-hidden="true">◎</b>我的 · 待开放</button>
    </nav>
  </div>
  <noscript><p class="empty">请在 Chrome 中启用 JavaScript 后重新打开页面。</p></noscript>
</body>
</html>
